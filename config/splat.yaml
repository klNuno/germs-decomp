      - [0x1848, .rodata, game/shop]
      - [0x1EEC, .rodata, game/sound]
      - [0x1FF4, .rodata, game/sprite]
      - [0x21BC, .rodata, game/thing]
      - [0x2228, .rodata, game/town]
      - [0x2278, .rodata, game/vehicle]
      - [0x2334,  rodata, psyq/801AC9D0]
      - [0x3334, .rodata, kaj/event]
      - [0x3374, .rodata, kaj/kaj]
      - [0x3398, .rodata, kaj/ll]
      - [0x34A8, .rodata, kaj/misc]
      - [0x3588,  rodata, psyq/801CD850]
      - [0x3688, .rodata, kaj/tim]
      - [0x36D8, .rodata, kaj/timer]
      - [0x3750, .rodata, kaj/tod]
      - [0x3774, .rodata, kaj/tss]
      - [0x3794, .rodata, kaj/view]
      - [0x37D0, .rodata, kaj/cdmgr]
      - [0x37F8, .rodata, kaj/map]
      - [0x3854, c, game/action]  # likely; start of .text; assert in action_load_set
      - [0x5C6C, c, game/actor]  # likely; no assert: jtbl cut (actor.c's jump tables at 4 mod 8)
      - [0x70F8, c, game/ai]  # likely; no assert: gp cut (ai_door_noise is lui before, gp from ai_find_target)
      - [0xA048, c, game/block]  # likely; block.c asserts; ends where block_area_flames stops being read through gp
      - [0xDE04, c, game/building]  # likely; no assert: starts after block.c; card strings follow its jump table
      - [0xF3F8, c, game/card]  # guess; no assert: jtbl cut; its end is a guess
      - [0x11304, c, game/dialog]  # guess; no assert: a string after card.c's jump tables; its start is a guess
      - [0x14CD4, c, game/door]  # likely; door.c asserts; door_list through gp from door_refresh_all
