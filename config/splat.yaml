      - [0x2ADD4, c, game/roadmap]  # likely; roadmap.c asserts
      - [0x31020, c, game/shop]  # likely; no assert: a normal function after roadmap.c's deferred inline tail
      - [0x3297C, c, game/sound]  # likely; sound.c asserts
      - [0x345D4, c, game/sprite]  # likely; sprite.c asserts
      - [0x37434, c, game/thing]  # likely; thing.c asserts; thing_list through gp from thing_refresh_all
      - [0x38B70, c, game/town]  # guess; no assert: a string after thing.c's jump table; its end is a guess
      - [0x3990C, c, game/vehicle]  # guess; vehicle.c asserts; its start is a guess
      - [0x3D1D0, asm, psyq/801AC9D0]  # LIBAPI,LIBC,LIBC2,LIBCARD,LIBCD,LIBETC,LIBGPU,LIBGS,LIBGTE,LIBMATH,LIBMCRD,LIBSN,LIBSND,LIBSPU
      - [0x5C4E0, c, kaj/event]  # proven; Sony code on both sides; event.c asserts
