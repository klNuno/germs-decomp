# splat config for SLPS_021.07 (retail, sha1 below). Section bounds checked on our exe:
# .rodata 0x80170000..0x80173054, .text 0x80173054..0x801D7328 (last jr ra at 0x801D7320),
# .data 0x801D7328..0x801DFC58, .sdata from gp 0x801DFC58 (set at 0x801C88BC) to 0x801DFE50,
# bss 0x801DFE50..0x801E7A10, cleared by __SN_ENTRY_POINT.
# Text units: game/<name> and kaj/<name> are the original source files, rebuilt from the evidence in
# docs/layout.md (config/layout.tsv, tools/split_units.py); psyq/<addr> are Sony library runs found by
# tools/psyq/match.py (asm, never decompiled). The kaj files (the developer's own library, assert strings
# kaj.c, ll.c, misc.c, tim.c, timer.c, tss.c, view.c, cdmgr.c) are linked among Sony's. Each c entry's
# comment gives the confidence of the file's boundaries and their evidence in short.
# Jtbl cuts: GCC 2.8.1 puts every jump table at .align 3 inside its object and the link keeps 4-byte
# alignment, so a jump table at 4 mod 8 from its file's .rodata start proves that a new object starts
# before it.
name: Germs Nerawareta Machi (SLPS-02107)
sha1: 178e728643d9b456436f4d19c9e07db11ab8aa2c
options:
  basename: germs
  platform: psx
  compiler: GCC
  base_path: ..
  target_path: extract/SLPS_021.07
  asm_path: asm
  asset_path: assets
  src_path: src
  build_path: build
  ld_script_path: linker/germs.ld
  symbol_addrs_path:
    - config/symbol_addrs.txt
    - config/symbol_addrs.psyq.txt
  undefined_funcs_auto_path: linker/undefined_funcs_auto.txt
  undefined_syms_auto_path: linker/undefined_syms_auto.txt

  gp_value: 0x801DFC58
  ld_gp_expression: main_SDATA_START
  find_file_boundaries: True
  migrate_rodata_to_functions: True
  disassemble_all: True
  use_legacy_include_asm: False
  include_asm_macro_style: maspsx_hack
  o_as_suffix: False

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel

  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]
  subalign: 4
  ld_bss_is_noload: True
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False

  string_encoding: SHIFT-JIS
  data_string_encoding: SHIFT-JIS
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

segments:
  - name: header
    type: header
    start: 0x0

  - name: main
    type: code
    start: 0x800
    vram: 0x80170000
    bss_size: 0x7BC0
    subsegments:
      # .rodata per source file, in the same order as .text (each start is the first symbol the file's
      # code references). Game and kaj files use the dot form so splat pairs them with their c file
      # and migrates jump tables and strings into their function.
      - [0x800, .rodata, game/action]
      - [0x93C, .rodata, game/actor]
      - [0x9F4, .rodata, game/ai]
      - [0xA50, .rodata, game/block]
      - [0xB08, .rodata, game/building]
      - [0xC1C, .rodata, game/card]
      - [0xCF0, .rodata, game/dialog]
      - [0xD04, .rodata, game/door]
      - [0xD44, .rodata, game/effect]
      - [0x1080, .rodata, game/event]
      - [0x122C, .rodata, game/mail]
      - [0x1268, .rodata, game/main]
      - [0x1280, .rodata, game/mod]
      - [0x1358, .rodata, game/object]
      - [0x16DC, .rodata, game/player]
