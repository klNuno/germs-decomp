# splat config for SLPS_021.07 (retail, sha1 below). Section bounds checked on our exe:
# .rodata 0x80170000..0x80173054, .text 0x80173054..0x801D7328 (last jr ra at 0x801D7320),
# .data 0x801D7328..0x801DFC58, .sdata from gp 0x801DFC58 (set at 0x801C88BC) to 0x801DFE50,
# bss 0x801DFE50..0x801E7A10, cleared by __SN_ENTRY_POINT.
# Text units: game/<addr> is the game's own code (13 source files, named by their assert strings);
# psyq/<addr> are Sony library runs found by tools/psyq/match.py (asm, never decompiled);
# kaj/<addr> are the pieces between them that no Sony signature matches: the developer's own
# library (assert strings kaj.c, ll.c, misc.c, tim.c, timer.c, tss.c, cdmgr.c), linked among Sony's.
# Game units are provisional: each starts at the first function that names a source file in an
# assert (the comment gives the file), moved earlier when the .rodata order forbids that cut. Files
# without an assert sit inside the previous unit; the layout study fixes the real boundaries.
# .rodata follows the same unit order (checked: every rodata symbol is referenced by one unit only).
# Jtbl cuts: GCC 2.8.1 puts every jump table at .align 3 inside its object and the link keeps 4-byte
# alignment, so a jump table at 4 mod 8 from its unit's .rodata start proves that a new object starts
# before it, at 4 mod 8. Such a cut sits just before the first function that needs it: the real file
# start may be a few functions earlier (no function between them uses .rodata, so the bytes agree).
name: Germs Nerawareta Machi (SLPS-02107)
sha1: 178e728643d9b456436f4d19c9e07db11ab8aa2c
options:
  basename: germs
  platform: psx
  compiler: GCC
  base_path: ..
  target_path: extract/SLPS_021.07
  asm_path: asm
  asset_path: assets
  src_path: src
  build_path: build
  ld_script_path: linker/germs.ld
  symbol_addrs_path:
    - config/symbol_addrs.txt
    - config/symbol_addrs.psyq.txt
  undefined_funcs_auto_path: linker/undefined_funcs_auto.txt
  undefined_syms_auto_path: linker/undefined_syms_auto.txt

  gp_value: 0x801DFC58
  ld_gp_expression: main_SDATA_START
  find_file_boundaries: True
  migrate_rodata_to_functions: True
  disassemble_all: True
  use_legacy_include_asm: False
  include_asm_macro_style: maspsx_hack
  o_as_suffix: False

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel

  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]
  subalign: 4
  ld_bss_is_noload: True
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False

  string_encoding: SHIFT-JIS
  data_string_encoding: SHIFT-JIS
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

segments:
  - name: header
    type: header
    start: 0x0

  - name: main
    type: code
    start: 0x800
    vram: 0x80170000
    bss_size: 0x7BC0
    subsegments:
      # .rodata per text unit, in the same order as .text (each start is the first symbol the unit's
      # code references). Game and kaj units use the dot form so splat pairs them with their c unit
      # and migrates jump tables and strings into their function.
      - [0x800, .rodata, game/80173054]
      - [0x93C, .rodata, game/8017546C]
      - [0x9F4, .rodata, game/801768F8]
      - [0xA50, .rodata, game/80179848]
      - [0xC1C, .rodata, game/8017EBF8]
      - [0xD04, .rodata, game/80185380]
      - [0xD44, .rodata, game/80185A60]
      - [0x1080, .rodata, game/8018920C]
      - [0x122C, .rodata, game/8018ACAC]
      - [0x1280, .rodata, game/8018D2DC]
      - [0x1358, .rodata, game/8018FA18]
      - [0x16DC, .rodata, game/80195DF0]
      - [0x1820, .rodata, game/8019A5D4]
      - [0x1EEC, .rodata, game/801A217C]
      - [0x1FF4, .rodata, game/801A3DD4]
      - [0x21BC, .rodata, game/801A7560]
      - [0x2278, .rodata, game/801AA360]
      - [0x2334,  rodata, psyq/801AC9D0]
      - [0x3334, .rodata, kaj/801CBCE0]
      - [0x3374, .rodata, kaj/801CC898]
      - [0x3398, .rodata, kaj/801CCAF4]
      - [0x3588,  rodata, psyq/801CD850]
      - [0x3688, .rodata, kaj/801CF790]
      - [0x36D8, .rodata, kaj/801CFD70]
      - [0x3750, .rodata, kaj/801D0880]
      - [0x3774, .rodata, kaj/801D12A8]
      - [0x37D0, .rodata, kaj/801D1E70]
      - [0x3854, c, game/80173054]  # action.c asserts
      - [0x5C6C, c, game/8017546C]  # no assert: jtbl cut
      - [0x70F8, c, game/801768F8]  # no assert: gp cut (ai_door_noise is lui before, gp from here)
      - [0xA048, c, game/80179848]  # block.c
